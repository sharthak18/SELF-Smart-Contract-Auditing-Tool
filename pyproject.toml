[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-auditor"
version = "2.2.0"
description = "Local multi-language smart contract security auditing and pre-audit analysis."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Self Auditor", email = "audit@self.tool"},
]
keywords = ["smart-contract", "security", "audit", "solidity", "web3", "blockchain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "click>=8.0",
  "rich>=13.0",
]

[project.scripts]
self = "self_tool.self:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["self_tool*"]

[tool.setuptools.package-data]
self_tool = ["knowledge/*.json"]
